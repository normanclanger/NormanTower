name: Deploy Registration Lambda

on:
  push:
    branches:
      - main
    paths:
      - 'lambda/**'
      - 'hugo/data/registration.yaml'
      - '.github/workflows/deploy-registration-lambda.yml'

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Build deployment package
        run: |
          mkdir -p package/config

          cp lambda/lambda_function.py package/
          cp hugo/data/registration.yaml package/config/

          cd package
          zip -r ../deployment.zip .

      - name: Show GitHub repository details
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Repository ID: ${{ github.repository_id }}"
          echo "Owner ID: ${{ github.repository_owner_id }}"
          echo "Branch/ref: ${{ github.ref }}"


      - name: Inspect GitHub OIDC claims
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          RESPONSE=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$RESPONSE" | jq -r '.value')

          TOKEN="$TOKEN" python -c '
          import os
          import json
          import base64

          token = os.environ["TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          print("Subject:", claims.get("sub"))
          print("Audience:", claims.get("aud"))
          '

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Deploy Lambda
        run: |
          aws lambda update-function-code \
            --function-name registration-api \
            --zip-file fileb://deployment.zip \
            --region eu-north-1
